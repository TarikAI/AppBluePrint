name: Bug report
description: blueprint.py crashed or gave a wrong result, or a generated view is wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If blueprint.py stopped with exit code 70, it recorded the error on your machine. Run `python .blueprint/bin/blueprint.py report` and paste its output below. It prints a redacted issue body and sends nothing.

        This issue is public. Remove project names, paths, customer data and secrets before you submit.
  - type: dropdown
    id: part
    attributes:
      label: Part of the skill
      options:
        - SKILL.md guidance
        - blueprint.py command
        - Stack preset
        - map.html / views
        - Installer
        - Other
    validations:
      required: true
  - type: input
    id: detail
    attributes:
      label: Command, preset or section
      description: For example `sync`, `nextjs-prisma`, `SKILL.md step 5`, the Mind map tab.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Output of `blueprint.py --version`
      description: Run `python .blueprint/bin/blueprint.py --version` in your project.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The command you ran.
      placeholder: python .blueprint/bin/blueprint.py sync
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `blueprint.py report`
      description: For a crash (exit code 70). Leave it empty otherwise.
      render: markdown
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Private details
      options:
        - label: I removed project names, paths, customer data and secrets from this issue.
          required: true
