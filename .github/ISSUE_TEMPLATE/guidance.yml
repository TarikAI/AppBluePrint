name: Wrong or unclear guidance
description: The skill told the agent something wrong or unclear, left something out, or the agent kept making the same mistake.
title: "[guidance] "
labels: ["guidance"]
body:
  - type: markdown
    attributes:
      value: |
        Guidance is what `SKILL.md`, its references and the presets tell the agent. Describe what the agent did and what it should have done. You can also record it on your machine with `python .blueprint/bin/blueprint.py feedback --kind guidance --note "..."`.

        This issue is public. Remove project names, paths, customer data and secrets before you submit.
  - type: dropdown
    id: part
    attributes:
      label: Part of the skill
      options:
        - SKILL.md guidance
        - blueprint.py command
        - Stack preset
        - map.html / views
        - Installer
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: detail
    attributes:
      label: Command, preset or section
      description: For example `SKILL.md step 4`, `references/schema.md` owner rules.
    validations:
      required: false
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Cursor
        - Other
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What the agent did
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What it should have done
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What the guidance says now
      description: Quote the line or name the section, if you found it.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Output of `blueprint.py --version`
      placeholder: "1.1.0"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Private details
      options:
        - label: I removed project names, paths, customer data and secrets from this issue.
          required: true
